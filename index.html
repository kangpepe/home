<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novi Hardiansyah | Portfolio</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-main: #000e3b;
            --btn-main: #ffdfbe;
            --text-light: #ffffff;
            --text-muted: #cfd3ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #000e3b 0%, #091a6b 100%);
            color: var(--text-light);
            min-height: 100vh;
        }

        .container {
            max-width: 480px;
            margin: auto;
            padding: 20px;
            text-align: center;
        }

        /* ===== PROFILE ===== */
        .profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--btn-main);
            object-fit: cover;
            margin-bottom: 15px;
        }

        .profile h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .profile p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 1.6;
        }

        /* ===== BUTTONS ===== */
        .links {
            margin-top: 25px;
        }

        .link-btn {
            background: var(--btn-main);
            color: #000;
            padding: 14px 18px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
            transition: 0.3s;
        }

        .link-btn i {
            font-size: 18px;
        }

        .link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255,223,190,0.3);
        }

        /* ===== VIDEO ===== */
        .video {
            margin: 25px 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video iframe {
            width: 100%;
            height: 220px;
            border: none;
        }

        /* ===== SOCIAL ===== */
        .social {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social a {
            width: 42px;
            height: 42px;
            background: rgba(255,255,255,0.1);
            color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: 0.3s;
        }

        .social a:hover {
            background: var(--btn-main);
            color: #000;
        }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 768px) {
            .container {
                max-width: 520px;
            }

            .video iframe {
                height: 280px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- PROFILE -->
    <div class="profile">
        <img src="profile.jpg" alt="Novi Hardiansyah">
        <h1>Novi Hardiansyah</h1>
        <p>
            PhD. Lecturer · Researcher · Trainer Microsoft<br>
            Founder PT. Niozone Group · Konsultan IT & Aplikasi
        </p>
    </div>

    <!-- LINKS -->
    <div class="links">
        <a href="#" class="link-btn">
            <i class="fas fa-graduation-cap"></i> My Lecturer – Website Blogs
        </a>

        <a href="#" class="link-btn">
            <i class="fab fa-orcid"></i> ORCID Research (Scopus & IEEE)
        </a>

        <a href="#" class="link-btn">
            <i class="fas fa-building"></i> PT. Niozone Group – Konsultan IT
        </a>
    </div>

    <!-- VIDEO -->
    <div class="video">
        <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID"
                allowfullscreen></iframe>
    </div>

    <!-- CV -->
    <a href="#" class="link-btn">
        <i class="fas fa-file-alt"></i> My Profile – Curriculum Vitae
    </a>

    <!-- SOCIAL -->
    <div class="social">
        <a href="#"><i class="fas fa-globe"></i></a>
        <a href="#"><i class="fas fa-envelope"></i></a>
        <a href="#"><i class="fab fa-whatsapp"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href=""><i class="fab fa-linkedin"></i></a>
    </div>

</div>

</body>
</html>
