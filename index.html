<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcomm</title>
    <meta http-equiv="refresh" content="1; url=https://kangpepey.com">
    <style>
        :root {
            --bg-color: #0d0f14;
            --text-color: #76c7e2;
            --border-color: #559db4;
            --font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #050505;
            color: var(--text-color);
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            font-size: 14px;
        }

        /* Top Bar */
        .top-bar {
            background-color: #0a0c10;
            display: flex;
            justify-content: space-around;
            padding: 5px 10px;
            font-size: 12px;
            border-bottom: 1px solid #1a1a1a;
        }

        .top-bar span { opacity: 0.8; }
        .green-text { color: #40c057; }

        /* Main Screen */
        .screen {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .terminal-box {
            border: 2px solid var(--border-color);
            width: 80%;
            max-width: 900px;
            padding: 30px;
            position: relative;
            background-color: var(--bg-color);
            box-shadow: 0 0 20px rgba(118, 199, 226, 0.1);
        }

        /* Logo and Info Layout */
        .content-wrapper {
            display: flex;
            gap: 40px;
        }

        .logo {
            font-size: 8px;
            line-height: 8px;
            white-space: pre;
            color: var(--text-color);
            flex-shrink: 0;
        }

        .sys-info {
            line-height: 1.4;
        }

        .sys-info b {
            color: var(--text-color);
            font-weight: bold;
        }

        .user-host {
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* Bottom TMUX Bar */
        .tmux-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 2px 10px;
            font-size: 13px;
        }

        /* Animations */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: var(--text-color);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .typing-text {
            border-right: 2px solid var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: typing 3s steps(30, end) forwards;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        /* CRT Scanline Effect */
        .screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body
</body>
</html>
